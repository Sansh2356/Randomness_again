[fs-generic]
"os/fs" = [
    "OpenDirMessage",
    "OpenFileMessage",
    "CloseFile",
    "CloseDir",
    "CreateDirMessage",
    "ReadFile",
    "SeekFile",
    "WriteFile",
    "TruncateFile",
    "SetLen",
    "GetMetadata",
    "NextEntry",
    "Flush",
    "Remove",
    "Rename",
    "AtomicCopy",
    "AsyncRead",
    "AsyncWrite",
    "AsyncCopyBlock",
    "SubscribeFilesystemEvent",
]
[gui-app]
"os/fs" = [
    "OpenDirMessage",
    "OpenFileMessage",
    "CloseFile",
    "CloseDir",
    "ReadFile",
    "NextEntry",
    "MapFileMessage",
    "GetMetadata",
]
"os/gui-server" = [
    "RegisterAppMessage",
    "RequestRedraw",
    "AnimateNextFrame",
    "SubmitFrame",
    "UpdateKeyboard",
    "HideKeyboard",
    "ShowModal",
]
"os/settings" = [
    "GetSystemTheme",
    "SubscribeSystemTheme",
    "GetDebugTouch",
    "SubscribeDebugTouch",
]
[navigable]
"os/gui-server" = [
    "GetPendingNavRequest",
    "FinishResponse",
    "NavigationCancel",
]

[photo-files]
# Uploading a photo of a strip or a phrase, picked in the system's file picker, and saving a share
# as an image.
"os/fs" = ["GetUserReadAccess", "GetUserWriteAccess", "GetAirlockReadAccess", "GetUsbReadAccess"]

[camera]
# Penlock share scanning: camera frames (asks once) and the viewfinder.
"os/camera" = ["Subscribe"]
"os/gui-server" = ["ShowCamera", "HideCamera"]
