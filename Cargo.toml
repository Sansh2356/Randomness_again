[package]
name = "my-app"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = [".foundation-sdk"]

[dependencies]
log = "0.4"
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = ".foundation-sdk/current/lib/keyos/sdk/crates/foundation-themes" }
cashu = { version = "0.18", default-features = false, features = ["wallet"] }
serde_json = "1"
camera = { path = ".foundation-sdk/current/lib/keyos/api/camera" }
# Bitcoin Vision: Penlock share arithmetic and the share-strip scanner (1.6 MB model, embedded).
penlock = { git = "https://github.com/penlock-io/bitcoin-vision", rev = "29dcf378623ac9a047d6e30790f20789903ae669" }
penlock-scan = { git = "https://github.com/penlock-io/bitcoin-vision", rev = "29dcf378623ac9a047d6e30790f20789903ae669", default-features = false, features = ["bundled-models"] }
# penlock wants a rand 0.9 RNG; it is fed from getrandom 0.2, which the SDK routes to the TRNG.
rand_core = "0.9"
getrandom = "0.2"
# Names penlock-scan's frame type; same version and features it already builds.
image = { version = "0.25", default-features = false }

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build" }

# Randomness is pre-wired: add `getrandom = "0.2"` (or `rand = "0.8"`) and calls
# route to the TRNG on device. Stay on the getrandom 0.2 line; 0.3+ is uncovered.
[patch.crates-io]
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }
# getrandom 0.4 with a KeyOS backend; see vendor/getrandom-0.4/README.vendored.
getrandom04 = { package = "getrandom", path = "vendor/getrandom-0.4" }
# filetime with a KeyOS stub; see vendor/filetime-0.2/README.vendored.
filetime = { path = "vendor/filetime-0.2" }
# tar with KeyOS taking its wasm paths; see vendor/tar-0.4/README.vendored.
tar = { path = "vendor/tar-0.4" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(keyos)"] }
